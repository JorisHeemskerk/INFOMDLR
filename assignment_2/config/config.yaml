# Default environment yaml file
# NOTE: See assignment_1/config/config_validation_template.py for the 
# parameter restrictions.

general:
    num_data_workers: 4 # Number of workers preparing batches.
jobs:
    job0:
        ### Data ###
        dataset: intra # Can be from [intra, cross]
        window_size: [32]
        stride: [32]
        downsample_factor: 4
        lazy: true
        train_val_split: [.8, .2]
        batch_size: [128]
        ### Model ###
        model: "eegnet" # Can be from: [baseline, eegnet, all]
        model_params: 
            hidden_size: 64
            num_layers: 1
        optimiser: "adam"
        learning_rate: [0.0001]
        weight_decay: [0.0001]
        n_epochs: 10
        k_folds: 8  # use 1 to ignore and 8 to use 1 whole file vor val.
        ### Tune ###
        # tune: true
        # n_trials: 3
        # n_startup_trials: 1
