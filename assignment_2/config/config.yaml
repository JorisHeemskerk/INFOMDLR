# Default environment yaml file
# NOTE: See assignment_1/config/config_validation_template.py for the 
# parameter restrictions.

general:
    num_data_workers: 4 # Number of workers preparing batches.
jobs:
    job0:
        model: "baseline" # Can be from: [baseline, all]
        dataset: intra # Can be from [intra, cross]
        window_size: [200]
        stride: [200]
        downsample_factor: 4
        lazy: true
        hidden_size: [64]
        num_layers: [1]
        optimiser: "adam"
        weight_decay: [0.0001]
        train_val_split: [.8, .2]
        batch_size: [128]
        n_epochs: 10
        k_folds: 5
        learning_rate: [0.0001]
